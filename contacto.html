<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="css/estilos.css">
    <style>
        /* Botón Flotante de WhatsApp */
        .btn-whatsapp {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #25D366;
            color: #FFF;
            padding: 15px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.4);
            transition: transform 0.3s;
        }
        .btn-whatsapp:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <header>
        <h1>Level-Up Gamer</h1>
        <nav>

                <li><a href="index.html">Inicio</a></li>

                <label>Nombre</label>

                <label>Mensaje</label>
                <textarea rows="4" required style="width:100%; background:#1a1a1a; color:#fff;"></textarea>
                <button type="submit" class="btn-primary">Enviar Mensaje</button>
            </form>
        </section>

    <!-- Enlace directo a WhatsApp[cite: 3] -->
