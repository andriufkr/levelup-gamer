<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Level-Up Gamer</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <h1>Level-Up Gamer</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Catálogo</a></li>
                <li><a href="registro.html">Registro</a></li>
                <li><a href="login.html">Ingresar</a></li>
                <li><a href="carrito.html">Carrito</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contenedor-formulario">
            <h2>Únete a la Comunidad</h2>
            <div id="alert-global" style="display:none; color: #FF4D4D; margin-bottom: 10px;"></div>
            
            <form id="form-registro" novalidate>
                <label for="nombre">Gamer Tag *</label>
                <input type="text" id="nombre" required>

                <label for="email">Correo (Usa tu correo Duoc para 20% de descuento) *</label>
                <input type="email" id="email" required>

                <label for="fecha-nacimiento">Fecha de Nacimiento (Solo 18+) *</label>
                <input type="date" id="fecha-nacimiento" required>
                <span id="error-fecha" style="display:none; color: #FF4D4D;"></span>

                <label for="password">Contraseña *</label>
                <input type="password" id="password" required>

                <label for="confirm-password">Confirmar Contraseña *</label>
                <input type="password" id="confirm-password" required>
                <span id="error-confirm-password" style="display:none; color: #FF4D4D;"></span>

                <label for="referido">Código de Referido (Opcional)</label>
                <input type="text" id="referido" placeholder="Suma puntos LevelUp">

                <button type="submit" class="btn-primary">Registrarse</button>
            </form>
        </section>
    </main>

    <script src="js/validaciones.js"></script>
</body>
</html>
